name: release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.95.0)"
        required: true
        type: string
      no_cache:
        description: "Disable caches"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-windows-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ inputs.no_cache && '' || 'npm' }}
          cache-dependency-path: dashboard/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $pkg = node -p "require('./package.json').version"
          if ($pkg -ne $env:VERSION) {
            Write-Host "::error::package.json version ($pkg) does not match input ($env:VERSION)"
            exit 1
          }
          $csproj = Get-Content TokenTrackerWin/TokenTrackerWin.csproj -Raw
          if ($csproj -notmatch "<Version>$([regex]::Escape($env:VERSION))</Version>") {
            Write-Host "::error::TokenTrackerWin.csproj version does not match $env:VERSION"
            exit 1
          }

      - name: Prepare draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) {
              Write-Host "::error::Release $tag is already published. Bump the version instead."
              exit 1
            }
          } else {
            gh release create $tag --target $env:GITHUB_SHA --draft --title $tag --notes "Windows release $env:VERSION"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard --no-audit --no-fund

      - name: Build dashboard
        run: npm run dashboard:build

      - name: Cache Node.js binary for EmbeddedServer
        if: ${{ !inputs.no_cache }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\ttnode-22.22.2
          key: node-win-x64-22.22.2

      - name: Bundle EmbeddedServer
        env:
          NODE_CACHE_DIR: ${{ runner.temp }}\ttnode-22.22.2
        run: powershell -ExecutionPolicy Bypass -File TokenTrackerWin/scripts/bundle-node.ps1

      - name: Cache NuGet packages
        if: ${{ !inputs.no_cache }}
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('TokenTrackerWin/TokenTrackerWin.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish app
        run: dotnet publish TokenTrackerWin/TokenTrackerWin.csproj -c Release -r win-x64 --self-contained true -o TokenTrackerWin/publish

      - name: Stage EmbeddedServer
        shell: pwsh
        run: Copy-Item TokenTrackerWin/EmbeddedServer TokenTrackerWin/publish/EmbeddedServer -Recurse -Force

      - name: Verify package contents
        shell: pwsh
        run: |
          $required = @(
            "TokenTrackerWin/publish/TokenTracker.exe",
            "TokenTrackerWin/publish/EmbeddedServer/node.exe",
            "TokenTrackerWin/publish/EmbeddedServer/tokentracker/bin/tracker.js",
            "TokenTrackerWin/publish/EmbeddedServer/tokentracker/dashboard/dist/index.html"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Host "::error::missing required file: $file"
              exit 1
            }
          }

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path TokenTrackerWin/publish/* -DestinationPath TokenTracker-win-x64.zip -CompressionLevel Optimal

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            Write-Host "::error::ISCC.exe not found"
            exit 1
          }
          & $iscc "/DMyAppVersion=$env:VERSION" TokenTrackerWin\installer\TokenTracker.iss
          $built = "TokenTrackerWin/installer/Output/TokenTracker-Setup-v$env:VERSION.exe"
          if (-not (Test-Path $built)) {
            Write-Host "::error::installer not produced at $built"
            exit 1
          }
          Copy-Item $built TokenTracker-Setup.exe -Force

      - name: Upload and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$env:VERSION"
          gh release upload $tag TokenTracker-win-x64.zip TokenTracker-Setup.exe --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
