name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  node:
    name: CLI + dashboard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix dashboard

      - name: Build dashboard
        run: npm run dashboard:build

      - name: Test and validate
        run: |
          npm test
          npm run validate:copy
          npm run validate:locale
          npm run validate:ui-hardcode
          npm run validate:guardrails
          npm run validate:versions
          node --test test/architecture-guardrails.test.js

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Test Windows-specific Node paths
        run: |
          node --test test/openclaw-parser.test.js
          node --test --test-name-pattern="native Windows" test/usage-limits.test.js
          node --test test/command-runner.test.js

      - name: Test Windows updater
        run: dotnet test TokenTrackerWin.Tests/TokenTrackerWin.Tests.csproj --configuration Release

      - name: Build Windows app
        run: dotnet build TokenTrackerWin/TokenTrackerWin.csproj --configuration Release
